<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Custo Real</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="modalLogin" class="modalLogin">

  <div class="modalConteudo">

    <h2>Entrar</h2>

    <input type="email" 
    id="email" 
    placeholder="Seu email" required>

    <input type="password" 
    id="senha" 
    placeholder="Senha" required>


    <button onclick="login()">Entrar</button>

    <button onclick="cadastrar()">
      Criar conta
    </button>

    <button onclick="fecharLogin()">
      Fechar
    </button>

  </div>

</div>


  <!-- ========================= -->
  <!-- TOPO DO SITE -->
  <!-- ========================= -->

  <header class="topo">

    <div class="logoArea">
      <img
        src="assets/images/logo.png"
        alt="Logo Meu Custo Real"
        class="logoImagem">
    </div>

    <nav id="menuCategorias" class="menuCategorias">
      <!-- Categorias geradas pelo JS -->
    </nav>

    <div class="loginArea">
        <button id="botaoLogin" class="botaoLogin">Login</button>
      <div id="menuUsuario" class="menuUsuario" style="display:none;">
       <button onclick="abrirMinhaConta()">Minha conta</button>
       <button onclick="abrirMinhasReceitas()">Minhas receitas</button>
       <button onclick="logout()">Sair</button>
     </div>
    </div>



  </header>

  <!-- ========================= -->
  <!-- BUSCA DE PRODUTOS -->
  <!-- ========================= -->

  <section class="areaBusca">

    <input
      type="search"
      id="busca"
      name="busca-produto"
      placeholder="Buscar produto..."
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      onkeyup="buscarProduto()">

  </section>

  <!-- ========================= -->
  <!-- CONTEÚDO PRINCIPAL -->
  <!-- ========================= -->

  <main class="conteudo">

    <!-- GRID DE PRODUTOS -->

    <section
      id="gridProdutos"
      class="gridProdutos">

      <!-- Produtos gerados via JS -->

    </section>


    <!-- ========================= -->
    <!-- CESTA DA RECEITA -->
    <!-- ========================= -->

    <aside class="cesta">

      <h2>Cesta da Receita</h2>

      <div id="listaCesta">
        <!-- itens adicionados aparecem aqui -->
      </div>

      <div class="totalCesta">

        <strong>Total:</strong>

        <span id="totalReceita">
          R$ 0.00
        </span>

      </div>

      <!-- CONFIGURAÇÕES -->

      <div class="configCesta">

        <label for="margemLucro">
          Margem de Lucro (%)
        </label>

<input
  type="number"
  id="margemLucro"
  placeholder="Ex: 20"
  oninput="atualizarCalculo()">

<label for="taxaPlataforma">
  Taxa da Plataforma (%)
</label>

<input
  type="number"
  id="taxaPlataforma"
  placeholder="Ex: 10 (iFood, 99...)"
  oninput="atualizarCalculo()">




      </div>

    </aside>

  </main>

  <!-- ========================= -->
  <!-- CALCULADORA DE PRODUTO -->
  <!-- ========================= -->

  <div
    id="painelCalculadora"
    class="painelCalculadora">

    <button
      class="fecharCalculadora"
      onclick="fecharCalculadora()">

      ✕

    </button>

    <h2 id="nomeProduto">
      Produto
    </h2>

    <!-- PREÇO -->

    <label for="preco">
      Preço do produto
    </label>

    <input
      type="text"
      id="preco"
      placeholder="R$ 0,00"
      onkeyup="mascaraDinheiro(this); atualizarCalculo();">

    <!-- PESO COMPRADO -->

    <label for="pesoComprado">
      Peso comprado
    </label>

    <input
      type="text"
      id="pesoComprado"
      placeholder="ex: 1kg ou 1000g"
      oninput="atualizarCalculo()">

    <small>

      Aceita unidades:

      <br>

      g, kg, ml, l

      <br>

      Exemplo:
      1kg
      •
      500g
      •
      1l
      •
      250ml

    </small>

    <!-- PESO USADO -->

    <label for="pesoUsado">
      Quantidade usada na receita
    </label>

    <input
      type="text"
      id="pesoUsado"
      placeholder="ex: 200g"
      oninput="atualizarCalculo()">

    <!-- RESULTADO -->

    <h3 id="resultado">
      R$ 0.00
    </h3>

    <!-- BOTÕES -->

    <div class="botoesCalculadora">

      <button onclick="adicionarCesta()">
        Adicionar à cesta
      </button>

      <button onclick="limparCalculadora()">
        Limpar
      </button>

    </div>

  </div>
  <footer> Meu Custo Real &copy; 2026 </a>
    <p>Feito por Bruno Bolivar <a href="https://bercelli.com">Bercelli</a></p>

  </footer>

  <!-- ========================= -->
  <!-- SCRIPT -->
  <!-- ========================= -->

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script src="auth.js"></script>




</body>
</html>
